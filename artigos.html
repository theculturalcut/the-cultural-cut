<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artigos | The Cultural Cut</title>
  <meta name="description" content="Reportagens, ensaios e opinião sobre música, cinema, séries e variedades.">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="assets/icons/icon.svg" type="image/png">
  <script src="script.js" defer></script>
</head>
<body>

  <div id="site-header"></div>

  <main id="conteudo">
    <div class="container">
      <header class="page-header">
        <h1 class="page-header__title">Artigos</h1>
        <p class="page-header__text">Reportagens, ensaios e opinião sobre música, cinema, séries e variedades.</p>
      </header>

      <div class="toolbar">
        <div class="chips" id="chips" role="group" aria-label="Filtrar por categoria"></div>
        <div class="toolbar__tools">
          <label class="visually-hidden" for="busca">Buscar artigos</label>
          <input class="input" id="busca" type="search" placeholder="Buscar artigos" autocomplete="off">
        </div>
      </div>

      <p class="list-summary" id="resultado" aria-live="polite"></p>
      <div class="grid grid--3" id="lista" aria-busy="true"></div>
      <nav class="pagination" id="paginacao" aria-label="Paginação"></nav>
    </div>
  </main>

  <div id="site-footer"></div>

  <script type="module" src="js/artigos.js"></script>
</body>
</html>
